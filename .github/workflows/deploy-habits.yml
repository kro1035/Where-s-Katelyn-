name: Deploy Habits Tracker to GitHub Pages

on:
  push:
    branches: [claude/progressive-habits-tracker-I0E8i]
    paths: [katelyn-habits/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-habits
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: katelyn-habits/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: katelyn-habits

      - name: Build
        run: npm run build
        working-directory: katelyn-habits
        env:
          VITE_BASE_URL: /Where-s-Katelyn-/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: katelyn-habits/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
