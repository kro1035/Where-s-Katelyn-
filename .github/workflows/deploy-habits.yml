name: Deploy Habits Tracker to GitHub Pages

on:
  push:
    branches: [claude/progressive-habits-tracker-I0E8i]
    paths: [katelyn-habits/**]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-habits
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: katelyn-habits/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: katelyn-habits

      - name: Build
        run: npm run build
        working-directory: katelyn-habits
        env:
          VITE_BASE_URL: /Where-s-Katelyn-/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: katelyn-habits/dist
          destination_dir: habits
